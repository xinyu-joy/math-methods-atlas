name: Publish mathematics atlas

on:
  push:
    branches: [main]
    paths:
      - 'math-atlas/**'
      - '.github/workflows/math-atlas-pages.yml'
  pull_request:
    paths:
      - 'math-atlas/**'
      - '.github/workflows/math-atlas-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-atlas-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install formula renderer
        working-directory: math-atlas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate static pages
        run: node math-atlas/scripts/build.mjs
      - name: Check page content and internal links
        run: node math-atlas/scripts/verify.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: math-atlas/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy mathematics atlas
        id: deployment
        uses: actions/deploy-pages@v4
